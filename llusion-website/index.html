<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLusion</title>
<meta name="description" content="LLusion: music, videos and everything else in one place.">
<meta property="og:title" content="LLusion">
<meta property="og:description" content="Music, videos and everything else in one place.">
<meta property="og:image" content="assets/portrait.jpg">
<meta name="theme-color" content="#E274D9">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#E274D9; --pink-soft:#F7DDF5; --ink:#111; --paper:#FFFBFE; --card:#fff;
    --muted:#5b4a5a; --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:Inter,system-ui,-apple-system,sans-serif;color:var(--ink);
    background:var(--paper);min-height:100vh;line-height:1.4;
  }
  .band{background:var(--pink);height:190px;border-bottom:2.5px solid var(--ink)}
  .wrap{max-width:520px;margin:-120px auto 0;padding:0 16px 48px;display:flex;flex-direction:column;align-items:center}
  .avatar{
    width:168px;height:168px;border-radius:50%;object-fit:cover;background:var(--pink);
    border:2.5px solid var(--ink);box-shadow:0 0 0 7px #fff,0 0 0 9.5px var(--ink);
  }
  .logo{width:190px;margin-top:-30px;transform:rotate(-5deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));position:relative}
  h1{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .tagline{margin-top:12px;color:var(--muted);font-size:15px;text-align:center}
  .socials{display:flex;gap:10px;margin:18px 0 26px}
  .socials a{
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;
    border:2px solid var(--ink);color:var(--ink);transition:transform .15s,background .15s;
  }
  .socials a:hover{background:var(--pink);transform:translateY(-2px)}
  .socials svg{width:20px;height:20px;fill:currentColor}
  .label{
    align-self:flex-start;font-family:Fredoka,sans-serif;font-weight:600;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;background:var(--ink);color:#fff;padding:5px 12px;border-radius:999px;margin-bottom:10px;
  }
  .featured{width:100%;margin-bottom:28px;display:flex;flex-direction:column}
  .featured iframe{width:100%;height:352px;border:0;border-radius:var(--radius);border:2.5px solid var(--ink);box-shadow:5px 5px 0 var(--ink);background:#282828}
  .promo{
    width:100%;background:var(--pink-soft);border:2.5px solid var(--ink);border-radius:var(--radius);
    box-shadow:5px 5px 0 var(--ink);padding:20px;
  }
  .promo h2{font-family:Fredoka,sans-serif;font-size:24px;font-weight:700}
  .promo p{margin:6px 0 14px;color:var(--muted)}
  .promo a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;font-weight:600;padding:11px 18px;border-radius:12px}
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .links a{
    display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 18px;background:var(--card);
    color:var(--ink);text-decoration:none;font-weight:600;font-size:16px;
    border:2.5px solid var(--ink);border-radius:var(--radius);box-shadow:4px 4px 0 var(--ink);
    transition:transform .12s,box-shadow .12s,background .12s;
  }
  .links a:hover{background:var(--pink-soft);transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
  .links a:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
  .links .ic{width:36px;height:36px;border-radius:10px;background:var(--pink);display:grid;place-items:center;flex:none;border:2px solid var(--ink)}
  .links svg{width:18px;height:18px;fill:var(--ink)}
  .links .t{flex:1}
  .links .arr{font-family:Fredoka,sans-serif;font-size:20px;opacity:.5}
  footer{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}
  a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main class="wrap">
  <img class="avatar" src="assets/portrait.jpg" alt="LLusion illustration">
  <img class="logo" src="assets/logo.png" alt="LLusion.music logo">
  <h1 id="name">LLusion</h1>
  <p class="tagline" id="tagline"></p>
  <nav class="socials" id="socials" aria-label="Social media"></nav>
  <section class="featured" id="featured"></section>
  <nav class="links" id="links" aria-label="Links"></nav>
  <footer>© <span id="yr"></span> LLusion</footer>
</main>
<script src="links.js"></script>
